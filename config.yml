version: 1

user:
  github_username: "fb1987"
  timezone: "America/Toronto"

env:
  GITHUB_TOKEN: ${{ github.token }}

commute:
  name: "Work"
  enabled: true
  days: ["mon", "tue", "wed", "thu", "fri"]
  arrival_time: "08:30"
  buffer_minutes: 10
  lead_minutes: 15
  estimated_duration_minutes: 35

route:
  mode: "DRIVE"
  origin:
    address: "79 Kent St N, Simcoe, ON"
  destination:
    address: "3080 Yonge St, Toronto, ON"

notifications:
  channel: "github_mention"
  issue_number: 2
  issue_title: "alert"
  state_issue_number: 3
  state_issue_title: "state"
  grace_minutes: 10
  leave_grace_minutes: 10
  quiet_hours:
    enabled: false
    start: "22:00"
    end: "06:00"
